<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Obras - OM Diseño y Construcción S.A. de C.V.</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap">
    <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>

    <header class="topbar">
        <div class="topbar-left">
            <img src="/img/logo.png" alt="Logo OM" class="topbar-logo">
            <h1 class="topbar-title">OM Diseño y Construcción</h1>
        </div>
        <div class="topbar-right">
            <span class="user-welcome">Bienvenido, <strong sec:authentication="name">Usuario</strong></span>
            <form th:action="@{/logout}" method="post" id="formLogout">
                <button type="submit" class="btn-logout" id="btnLogout">Cerrar Sesión</button>
            </form>
        </div>
    </header>

    <main class="main-content">
        <div class="main-header">
            <div class="main-header-info">
                <h2>Relación de Obras en Proceso</h2>
            </div>

            <div class="header-controles"></div>
                <!--Filtro por Status-->
                <div class="filtros-container">
                    <label for="filtroStatus">Filtrar por Estatus:</label>
                    <select id="filtroStatus">
                        <option value="TODOS">Todas las Obras</option>
                        <option value="EJECUCION">En Ejecución</option>
                        <option value="CIERRE">En Cierre</option>
                    </select>
                </div>

                <!--Boton de Nueva Obra-->
                <div class="main-header-actions oculto">
                    <a th:href="@{/obras/nueva}" class="btn-action">
                        <span class="btn-icon">+</span> NUEVA OBRA
                    </a>
                </div>
                <!--Boton de Agregar Usuario-->
                <div class="main-header-usuario oculto">
                    <a th:href="@{/nuevo-usuario}" class="btn-action">
                        <span class="btn-icon">+</span> AGREGAR USUARIO
                    </a>
                </div>
            </div>
        </div>

        <div class="obras-grid" id="obrasGrid">
        </div>

        <!--MODAL PARA PRESUPUESTOS EDITAR FECHA Y ARCHIVOS -->
        <div id="modalEdicion" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;">
        <div style="background: white; padding: 25px; border-radius: 8px; width: 90%; max-width: 500px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
            <h3 style="margin-top: 0; margin-bottom: 20px; color: #2c3e50;">Completar Datos de Obra</h3>

            <form id="formEdicionObra">
                <input type="hidden" id="editIdObra">

                <div style="margin-bottom: 15px;">
                <label style="display: block; font-weight: bold; margin-bottom: 5px;">Nombre de la Obra:</label>
                <input type="text" id="editNombreObra" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;" required>
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display: block; font-weight: bold; margin-bottom: 5px;">Monto antes de IVA:</label>
                <input type="number" step="0.01" id="editMontoObra" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;" required>
            </div>

                <div style="margin-bottom: 15px;">
                    <label style="display: block; font-weight: bold; margin-bottom: 5px;">Fecha de Inicio:</label>
                    <input type="date" id="editFechaInicio" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
                </div>

                <div style="margin-bottom: 15px;">
                    <label style="display: block; font-weight: bold; margin-bottom: 5px;">Fecha de Terminación:</label>
                    <input type="date" id="editFechaTerminacion" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;" >
                </div>

                <div style="margin-bottom: 15px;">
                    <label style="display: block; font-weight: bold; margin-bottom: 5px;">Número de Semanas:</label>
                    <input type="number" id="editNumeroSemanas" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; background-color: #f8f9fa;" readonly>
                </div>

                <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">

                <div style="margin-bottom: 15px;">
                    <label style="display: block; font-weight: bold; margin-bottom: 5px;">Documento Faltante (Opcional):</label>
                    <select id="editCategoriaDoc" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 10px;">
                        <option value="">Selecciona qué documento vas a subir...</option>
                        <option value="ORDEN_COMPRA">Orden de Compra</option>
                        <option value="ORDEN_COMPRA_EXT1">Orden de Compra Extraordinaria 1</option>
                        <option value="ORDEN_COMPRA_EXT2">Orden de Compra Extraordinaria 2</option>
                        <option value="PRESUPUESTO">Presupuesto</option>
                        <option value="EXPLOSION_INSUMOS">Explosión de Insumos</option>
                        <option value="PROYECTO">Proyecto</option>
                        <option value="PROGRAMA">Programa</option>
                        <option value="MEMORIAS">Memorias</option>
                    </select>
                    <input type="file" id="editArchivoDoc" style="width: 100%;">
                </div>

                <div style="display: flex; gap: 10px; margin-top: 25px;">
                    <button type="button" onclick="cerrarModalEdicion()" style="flex: 1; padding: 10px; background: #95a5a6; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Cancelar</button>
                    <button type="submit" style="flex: 1; padding: 10px; background: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Guardar Cambios</button>
                </div>
            </form>
        </div>
    </div>


    </main>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/js/datosUsuario.js"></script>
    <script src="/js/listarObras.js"></script>

</body>
</html>
