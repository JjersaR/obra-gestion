<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Obras - OM Diseño y Construcción S.A. de C.V.</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap">
    <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>

    <header class="topbar">
        <div class="topbar-left">
            <img src="/img/logo.jpeg" alt="Logo OM" class="topbar-logo">
            <h1 class="topbar-title">OM Diseño y Construcción</h1>
        </div>
        <div class="topbar-right">
            <span class="user-welcome">Bienvenido, <strong sec:authentication="name">Usuario</strong></span>
            <form th:action="@{/logout}" method="post" id="formLogout">
                <button type="submit" class="btn-logout" id="btnLogout">Cerrar Sesión</button>
            </form>
        </div>
    </header>

    <main class="main-content">
        <div class="main-header">
            <div class="main-header-info">
                <h2>Relación de Obras en Proceso</h2>
            </div>
            <!--Boton de Nueva Obra-->
            <div class="main-header-actions oculto">
                <a th:href="@{/obras/nueva}" class="btn-action">
                    <span class="btn-icon">+</span> NUEVA OBRA
                </a>
            </div>
        </div>

        <div class="obras-grid">
            <div th:each="obra, iter : ${obras}"
                th:class="${'obra-card ' + (obra.status.name() == 'EJECUCION' ? 'status-execution' : 'status-closing')}">

                <div class="obra-card-header">
                    <span class="obra-id" th:text="${'OBRA ' + #numbers.formatInteger(iter.count, 2)}">OBRA 01</span>

                    <span class="obra-status" th:text="${obra.status.name() == 'EJECUCION' ? 'en proceso de ejecución' : 'en cierre'}">
                        status
                    </span>
                </div>

                <div class="obra-card-body">
                    <p class="obra-detail-pair">
                        <strong>NOMBRE O NÚMERO:</strong>
                        <span th:text="${obra.nombre}">Nombre de la Obra</span>
                    </p>
                    <p class="obra-detail-pair">
                        <strong>MONTO ANTES DE IVA:</strong>
                        <span th:text="${'$' + #numbers.formatDecimal(obra.montoAntesIva, 1, 'COMMA', 2, 'POINT')}">$0.00</span>
                    </p>
                    <p class="obra-detail-pair">
                        <strong>FECHA INICIO:</strong>
                        <span th:text="${#temporals.format(obra.fechaInicio, 'dd/MM/yyyy')}">01/01/2026</span>
                    </p>
                    <p class="obra-detail-pair">
                        <strong>FECHA TERMINACIÓN:</strong>
                        <span th:text="${#temporals.format(obra.fechaFin, 'dd/MM/yyyy')}">31/12/2026</span>
                    </p>
                    <p class="obra-detail-pair">
                        <strong>GERENTE:</strong>
                        <span th:text="${obra.gerente}">Ingeniero</span>
                    </p>
                    <p class="obra-detail-pair">
                        <strong>RESIDENTE:</strong>
                        <span th:text="${obra.residente}">Arquitecto</span>
                    </p>

                    <div class="obra-actions">
                        <a th:href="@{/obras/detalles/{id}(id=${obra.id})}" class="btn-detalle">
                            DETALLES DE OBRA
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="/js/datosUsuario.js"></script>

</body>
</html>
