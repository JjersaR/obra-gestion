server:
  address: ${SERVER_ADDRESS}
  port: ${SERVER_PORT}

spring:
  application:
    name: obra-gestion
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB  
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    driver-class-name: ${DATABASE_DRIVER}
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: ${DATABASE_PLATFORM}
  docker:
    compose:
      enabled: false

external-server:
  minio:
    endpoint: ${MINIO_ENDPOINT}
    accessKey: ${MINIO_ACCESS_KEY}
    secretKey: ${MINIO_SECRET_KEY}
    buckets:
      requerimiento: ${MINIO_BUCKET_REQUERIMIENTO}
      construccion: ${MINIO_BUCKET_CONSTRUCCION}
      comun: ${MINIO_BUCKET_DOCUMENTOS}

logging:
  pattern:
    dateformat: hh:mm:ss
