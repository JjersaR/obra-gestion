server:
  address: ${SERVER_ADDRESS}
  port: ${SERVER_PORT}

spring:
  application:
    name: obra-gestion

  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    driver-class-name: ${DATABASE_DRIVER}

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: ${DATABASE_PLATFORM}

  docker:
    compose:
      enabled: false

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

external-server:
  minio:
    endpoint: ${MINIO_ENDPOINT}
    accessKey: ${MINIO_ACCESS_KEY}
    secretKey: ${MINIO_SECRET_KEY}
    buckets:
      requerimiento: ${MINIO_BUCKET_REQUERIMIENTO}
      construccion: ${MINIO_BUCKET_CONSTRUCCION}
      comun: ${MINIO_BUCKET_DOCUMENTOS}

logging:
  pattern:
    dateformat: hh:mm:ss